<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🧮 口算小练习</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:          #f0f4ff;
    --card-bg:     #ffffff;
    --primary:     #ff8a5c;
    --primary-hov: #ff6f3c;
    --green:       #51cf66;
    --green-bg:    #d3f9d8;
    --red:         #ff6b6b;
    --red-bg:      #ffe3e3;
    --gold:        #fcc419;
    --text:        #2d3436;
    --text-light:  #636e72;
    --radius:      16px;
    --shadow:      0 4px 20px rgba(0,0,0,.08);
    --font:        'Segoe UI', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
  }

  html { font-size: 16px; }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 24px 16px 60px;
    background-image:
      radial-gradient(circle at 20% 30%, #e8f0fe 0%, transparent 50%),
      radial-gradient(circle at 80% 70%, #fff0e8 0%, transparent 50%);
  }

  .container { max-width: 820px; margin: 0 auto; }

  /* Header */
  .header { text-align: center; padding: 24px 0 20px; }
  .header h1 {
    font-size: 2.2rem; font-weight: 800;
    background: linear-gradient(135deg, #ff6b6b, #fcc419, #51cf66, #339af0);
    background-clip: text; -webkit-background-clip: text;
    -webkit-text-fill-color: transparent; letter-spacing: 4px;
  }
  .header p { color: var(--text-light); font-size: 0.95rem; margin-top: 6px; }

  /* Toolbar */
  .toolbar {
    display: flex; flex-wrap: wrap; align-items: center; gap: 12px;
    background: var(--card-bg); padding: 14px 20px;
    border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 20px;
  }
  .toolbar label {
    font-size: 0.9rem; font-weight: 600; color: var(--text-light);
    display: flex; align-items: center; gap: 6px;
  }
  .toolbar select, .toolbar input[type="number"] {
    font: inherit; font-size: 0.9rem; padding: 6px 12px;
    border: 2px solid #dee2e6; border-radius: 10px; background: #fff;
    outline: none; transition: border-color .2s;
  }
  .toolbar select { min-width: 90px; }
  .toolbar input[type="number"] { width: 80px; }
  .toolbar select:focus, .toolbar input:focus { border-color: var(--primary); }
  .toolbar .spacer { flex: 1; }

  /* Buttons */
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    font: inherit; font-weight: 700; font-size: 0.95rem; padding: 10px 22px;
    border: none; border-radius: 12px; cursor: pointer;
    transition: transform .15s, box-shadow .2s; user-select: none;
  }
  .btn:active { transform: scale(.96); }
  .btn:disabled { opacity: .5; cursor: not-allowed; transform: none; }
  .btn-primary {
    background: var(--primary); color: #fff;
    box-shadow: 0 3px 10px rgba(255,138,92,.4);
  }
  .btn-primary:hover:not(:disabled) { background: var(--primary-hov); }
  .btn-outline {
    background: transparent; color: var(--text); border: 2px solid #dee2e6;
  }
  .btn-outline:hover:not(:disabled) { border-color: var(--primary); color: var(--primary); }
  .btn-success {
    background: var(--green); color: #fff;
    box-shadow: 0 3px 10px rgba(81,207,102,.4);
  }
  .btn-success:hover:not(:disabled) { background: #40c057; }

  /* Problem grid */
  .problems-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 20px;
  }
  .problem-card {
    background: var(--card-bg); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 18px 16px 16px;
    display: flex; flex-direction: column; align-items: center;
    position: relative; border: 3px solid transparent; transition: box-shadow .3s;
  }
  .problem-card.correct { border-color: var(--green); background: var(--green-bg); }
  .problem-card.wrong   { border-color: var(--red);   background: var(--red-bg); }

  .problem-card .equation {
    font-size: 1.5rem; font-weight: 700; letter-spacing: 2px;
    margin-bottom: 10px; color: var(--text);
  }
  .problem-card .tag {
    position: absolute; top: 8px; right: 10px;
    font-size: 0.7rem; font-weight: 700; padding: 2px 10px;
    border-radius: 20px; color: #fff;
  }
  .tag-add { background: #339af0; }
  .tag-sub { background: #cc5de8; }

  .problem-card .input-row {
    display: flex; align-items: center; gap: 8px;
    width: 100%; justify-content: center;
  }
  .problem-card .input-row input {
    font: inherit; font-size: 1.3rem; font-weight: 700; width: 80px;
    text-align: center; padding: 6px 4px; border: 2px solid #dee2e6;
    border-radius: 10px; outline: none; transition: border-color .2s;
  }
  .problem-card .input-row input:focus { border-color: var(--primary); }
  .problem-card .input-row input:disabled { background: #f8f9fa; }

  .problem-card .result-mark {
    font-size: 1.2rem; font-weight: 700; min-width: 30px; text-align: center;
  }
  .result-mark.yes { color: var(--green); }
  .result-mark.no  { color: var(--red); }

  .problem-card .correct-answer {
    font-size: 0.85rem; color: var(--text-light); margin-top: 4px; display: none;
  }
  .problem-card.wrong .correct-answer { display: block; color: var(--red); }

  /* Stats bar */
  .stats-bar {
    background: var(--card-bg); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 16px 20px;
    display: flex; flex-wrap: wrap; align-items: center;
    justify-content: space-between; gap: 12px; margin-bottom: 20px;
  }
  .stats-bar .stats {
    display: flex; gap: 20px; font-weight: 600; font-size: 1rem;
  }
  .stats-bar .stats span { display: flex; align-items: center; gap: 4px; }
  .stats-bar .actions { display: flex; gap: 10px; }

  /* Loading & Empty */
  .loading { text-align: center; padding: 40px; color: var(--text-light); }
  .spinner {
    display: inline-block; width: 36px; height: 36px;
    border: 4px solid #dee2e6; border-top-color: var(--primary);
    border-radius: 50%; animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
  .empty-state .emoji { font-size: 3.5rem; margin-bottom: 12px; }
  .empty-state h3 { font-size: 1.2rem; margin-bottom: 6px; color: var(--text); }

  /* Responsive */
  @media (max-width: 600px) {
    html { font-size: 14px; }
    .problems-grid { grid-template-columns: 1fr; }
    .header h1 { font-size: 1.6rem; }
    .toolbar { flex-direction: column; align-items: stretch; }
    .toolbar .spacer { display: none; }
    .stats-bar { flex-direction: column; align-items: stretch; }
    .stats-bar .actions { justify-content: center; }
  }
</style>
</head>
<body>
<div class="container">
  <header class="header">
    <h1>🧮 口算小练习</h1>
    <p>面向小学生的 50~100 以内加减法训练</p>
  </header>

  <div class="toolbar">
    <label>📝 题数 <input type="number" id="countInput" value="10" min="1" max="50"></label>
    <label>🎯 类型
      <select id="typeSelect">
        <option value="both">加减混合</option>
        <option value="add">加法</option>
        <option value="sub">减法</option>
      </select>
    </label>
    <span class="spacer"></span>
    <button class="btn btn-primary" id="generateBtn">✨ 生成题目</button>
  </div>

  <div id="problemsArea">
    <div class="empty-state">
      <div class="emoji">📚</div>
      <h3>点击「生成题目」开始练习</h3>
      <p>每次随机生成 50~100 以内的加减法</p>
    </div>
  </div>

  <div class="stats-bar" id="statsBar" style="display:none;">
    <div class="stats">
      <span>📝 共 <strong id="totalCount">0</strong> 题</span>
      <span>✅ 正确 <strong id="correctCount" style="color:var(--green)">0</strong></span>
      <span>❌ 错误 <strong id="wrongCount" style="color:var(--red)">0</strong></span>
      <span>📊 正确率 <strong id="accuracy" style="color:var(--gold)">0%</strong></span>
    </div>
    <div class="actions">
      <button class="btn btn-success" id="submitBtn">✅ 提交答案</button>
      <button class="btn btn-outline" id="newBtn">🔄 换一题</button>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  const $ = (s) => document.querySelector(s);
  const area = $('#problemsArea');
  const genBtn = $('#generateBtn');
  const submitBtn = $('#submitBtn');
  const newBtn = $('#newBtn');
  const statsBar = $('#statsBar');
  const totalEl = $('#totalCount');
  const correctEl = $('#correctCount');
  const wrongEl = $('#wrongCount');
  const accuracyEl = $('#accuracy');

  let problems = [];
  let answered = false;
  const API = '/api';

  async function fetchProblems(count, type) {
    const res = await fetch(API + '/generate?count=' + count + '&types=' + type);
    if (!res.ok) throw new Error('请求失败 ' + res.status);
    return res.json();
  }

  function renderProblems(data) {
    problems = data.problems;
    answered = false;
    if (!problems.length) {
      area.innerHTML = '<div class="empty-state"><div class="emoji">😅</div><h3>暂无题目</h3></div>';
      statsBar.style.display = 'none'; return;
    }

    var html = '<div class="problems-grid">';
    problems.forEach(function (p) {
      var tagClass = p.type === 'add' ? 'tag-add' : 'tag-sub';
      var tagText  = p.type === 'add' ? '加法' : '减法';
      html += '<div class="problem-card" data-id="' + p.id + '" data-answer="' + p.answer + '">';
      html += '<span class="tag ' + tagClass + '">' + tagText + '</span>';
      html += '<div class="equation">' + p.operand1 + ' ' + p.operator + ' ' + p.operand2 + ' = ?</div>';
      html += '<div class="input-row">';
      html += '<input type="number" class="answer-input" placeholder="?" autocomplete="off">';
      html += '<span class="result-mark"></span></div>';
      html += '<div class="correct-answer">正确答案：' + p.answer + '</div></div>';
    });
    html += '</div>';
    area.innerHTML = html;

    var first = document.querySelector('.answer-input');
    if (first) setTimeout(function () { first.focus(); }, 100);

    totalEl.textContent = problems.length;
    correctEl.textContent = '0'; wrongEl.textContent = '0'; accuracyEl.textContent = '0%';
    statsBar.style.display = 'flex';
    submitBtn.disabled = false;
    submitBtn.textContent = '✅ 提交答案';
  }

  function checkAnswers() {
    if (answered) return;
    answered = true;
    var correct = 0;
    var cards = document.querySelectorAll('.problem-card');

    cards.forEach(function (card) {
      var input = card.querySelector('.answer-input');
      var mark  = card.querySelector('.result-mark');
      var ans   = parseInt(card.dataset.answer, 10);
      var usr   = input.value.trim() === '' ? null : parseInt(input.value, 10);
      input.disabled = true;

      if (usr === ans) {
        card.classList.add('correct');
        mark.textContent = '✅'; mark.className = 'result-mark yes';
        correct++;
      } else {
        card.classList.add('wrong');
        mark.textContent = '❌'; mark.className = 'result-mark no';
      }
    });

    var total = problems.length;
    var pct = total > 0 ? Math.round((correct / total) * 100) : 0;
    correctEl.textContent = correct;
    wrongEl.textContent = total - correct;
    accuracyEl.textContent = pct + '%';
    submitBtn.disabled = true;
    submitBtn.textContent = '📊 已批改';
  }

  genBtn.addEventListener('click', async function () {
    var count = parseInt($('#countInput').value, 10) || 10;
    var type  = $('#typeSelect').value;
    genBtn.disabled = true; genBtn.textContent = '⏳ 生成中…';
    statsBar.style.display = 'none';
    area.innerHTML = '<div class="loading"><div class="spinner"></div><p style="margin-top:12px;">正在出题…</p></div>';
    try {
      var data = await fetchProblems(count, type);
      renderProblems(data);
    } catch (err) {
      area.innerHTML = '<div class="empty-state"><div class="emoji">😵</div><h3>出题失败</h3><p>' + err.message + '</p></div>';
    } finally {
      genBtn.disabled = false; genBtn.textContent = '✨ 生成题目';
    }
  });

  submitBtn.addEventListener('click', checkAnswers);
  newBtn.addEventListener('click', function () { genBtn.click(); });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !submitBtn.disabled && e.target.classList.contains('answer-input')) {
      checkAnswers();
    }
  });

  window.addEventListener('DOMContentLoaded', function () {
    setTimeout(function () { genBtn.click(); }, 300);
  });
})();
</script>
</body>
</html>
